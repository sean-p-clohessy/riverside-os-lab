const Models = (() => {
 function race(locked=false){return {locked,value:0,owner:null,pc:[0,0],local:[null,null],log:[]};}
 function raceStep(s,i){
  if(s.pc[i]>=3)return;
  const name=['A','B'][i];
  if(s.locked && s.owner!==null && s.owner!==i){s.log.push(`${name}: blocked on mutex held by ${['A','B'][s.owner]}`);return;}
  if(s.pc[i]===0){if(s.locked)s.owner=i;s.local[i]=s.value;s.log.push(`${name}: READ counter=${s.value}${s.locked?' (mutex acquired)':''}`);}
  if(s.pc[i]===1){s.local[i]++;s.log.push(`${name}: ADD 1 → local=${s.local[i]}`);}
  if(s.pc[i]===2){s.value=s.local[i];s.log.push(`${name}: WRITE counter=${s.value}${s.locked?' (mutex released)':''}`);if(s.locked)s.owner=null;}
  s.pc[i]++;
 }
 function deadlock(ordered=false){return {ordered,owners:[null,null],pc:[0,0],log:[]};}
 function deadStep(s,i){
  if(s.pc[i]>=3)return;
  const n=['A','B'][i], orders=s.ordered?[[0,1],[0,1]]:[[0,1],[1,0]],names=['spool','log'];
  if(s.pc[i]===2){s.owners=s.owners.map(o=>o===i?null:o);s.pc[i]++;s.log.push(`${n}: committed work; released both locks`);return;}
  const r=orders[i][s.pc[i]];
  if(s.owners[r]!==null && s.owners[r]!==i){s.log.push(`${n}: WAIT for ${names[r]}, held by ${['A','B'][s.owners[r]]}`);return;}
  s.owners[r]=i;s.pc[i]++;s.log.push(`${n}: acquired ${names[r]}`);
 }
 function isDead(s){return !s.ordered && s.pc[0]===1 && s.pc[1]===1;}
 function pipeline(cores=1,diskTime=6){
  let jobs=Array.from({length:12},(_,i)=>({id:i+1,cpu:2,disk:diskTime,state:'ready',finish:null})), cpu=Array(cores).fill(null), disk=null,q=[],timeline=[],t=0,busy=0,dbusy=0;
  while(jobs.some(j=>j.finish===null)&&t<500){
   for(let c=0;c<cores;c++)if(cpu[c]===null){const j=jobs.find(j=>j.state==='ready');if(j){j.state='cpu';cpu[c]=j;}}
   if(disk===null&&q.length)disk=q.shift();
   timeline.push({start:t,cpu:cpu.map(j=>j?j.id:'–').join(', '),disk:disk?disk.id:'–',queue:q.length});
   const finished=[];for(let c=0;c<cores;c++)if(cpu[c]){busy++;cpu[c].cpu--;if(cpu[c].cpu===0){finished.push(cpu[c]);cpu[c]=null;}}
   if(disk){dbusy++;disk.disk--;if(disk.disk===0){disk.finish=t+1;disk.state='done';disk=null;}}
   for(const j of finished){j.state='io';q.push(j);}t++;
  }
  return {cores,diskTime,elapsed:t,throughput:12/t,cpuUtil:busy/(cores*t)*100,diskUtil:dbusy/t*100,jobs,timeline};
 }
 function permissions(policy='original'){
  const x=policy==='group'||policy==='everyone',r=x,guest=policy==='everyone';
  const log=['Application: open /shared/report.txt for reading','Kernel: resolve / (search allowed)'];
  if(!x)log.push('Kernel: /shared lacks group search (x) → EACCES; no device request');
  else {log.push('Kernel: /shared group search (x) allowed','Kernel: report.txt group read (r) allowed','open succeeds → application requests read; cache miss assumed → file-system block lookup','Driver: submit device request; caller waits','Device completion interrupt → caller becomes ready','read returns the requested bytes');}
  return {policy,allowed:x&&r,guestAllowed:guest,log};
 }
 function buffer(capacity=2,policy='drop',cut=false){
  let queue=0,pending=0,generated=0,accepted=0,persisted=0,dropped=0,lost=0,rows=[];
  for(let t=1;t<=12;t++){
   const arrived=t<=4?3:0;generated+=arrived;pending+=arrived;
   const take=Math.min(pending,capacity-queue);queue+=take;pending-=take;accepted+=take;
   if(policy==='drop'){dropped+=pending;pending=0;}
   let written=queue>0?1:0;queue-=written;persisted+=written;
   if(cut&&t===4){lost=queue;queue=0;}
   rows.push({t,arrived,accepted:take,written,queue,pending,persisted,dropped,lost});
   if(cut&&t===4)break;
  }
  return {capacity,policy,cut,generated,accepted,persisted,dropped,lost,queue,pending,rows};
 }
 function controller(priority='telemetry',samples=2){
  const memory=48+samples*4,rows=[],jobs=[];
  if(memory>64)return {priority,samples,memory,boot:false,misses:0,rows,jobs};
  for(let t=0;t<20;t++){
   if(t%5===0){jobs.push({name:'Control',release:t,deadline:t+2,left:1,finish:null},{name:'Telemetry',release:t,deadline:t+5,left:3,finish:null});}
   const ready=jobs.filter(j=>j.left>0),first=priority==='control'?'Control':'Telemetry';
   ready.sort((a,b)=>(a.name===first?0:1)-(b.name===first?0:1)||a.release-b.release);
   const j=ready[0];if(j){j.left--;if(j.left===0)j.finish=t+1;}
   rows.push({t,task:j?j.name:'Idle'});
  }
  const misses=jobs.filter(j=>j.name==='Control'&&(j.finish===null||j.finish>j.deadline)).length;
  return {priority,samples,memory,boot:true,misses,rows,jobs};
 }
 return {race,raceStep,deadlock,deadStep,isDead,pipeline,permissions,buffer,controller};
})();

</script><script>/* Original self-guided course material. Numerical examples refer to models.js. */
const Course = {
  review: ['I used specific values or trace events from my experiments.', 'I explained why the result changed, not just what I clicked.', 'I identified a trade-off or a limit of the model.'],
  weeks: {
    6: {
      title: 'Concurrency and resource efficiency',
      outcomes: ['Explain how interleaving can corrupt shared state.', 'Diagnose a circular wait and justify a prevention strategy.', 'Use workload evidence to distinguish utilisation, throughput and responsiveness.'],
      plan: [['Get ready and recap',10],['OS-601: shared state',30],['OS-602: locks and waiting',25],['Take a screen break',5],['OS-603: find the bottleneck',30],['Knowledge check and export',20]],
      recap: 'A process is a running program with resources such as an address space. A thread is an execution path within it. Ready means able to run but waiting for CPU time; running means executing; blocked means waiting for an event or resource. Concurrency is overlapping progress; parallelism is execution at the same instant on different processing resources. A single core can interleave threads and still produce a race.',
      recapSource: 'https://pages.cs.wisc.edu/~remzi/OSTEP/threads-intro.pdf',
      exit: 'A shared service is slow during busy periods. Explain which evidence would make you investigate locks, CPU capacity or device queues first. Use at least two results from this week and name one additional measurement you would collect.',
      quiz: [
        {q:'Two threads share one core. Can their updates still interfere?',options:['No: a race requires two cores.','Yes: one update can be interrupted between its read and write.','Only if the file system is full.'],answer:1,why:'Interleaving is enough. In OS-601 both reads can see 0 before either write occurs. Parallel execution is not required.',revisit:'race'},
        {q:'A writer holds a mutex briefly; a reader waits and then continues. What does that establish?',options:['Deadlock: all waiting is deadlock.','Starvation: the reader can never run.','Temporary blocking; a permanent circular wait has not been established.'],answer:2,why:'Waiting alone does not establish deadlock or starvation. OS-602 instead shows each worker holding a resource the other needs.',revisit:'dead'},
        {q:'A 12-request batch finishes in 60 ms. What is its batch throughput?',options:['0.2 requests/ms','5 requests/ms','60 requests/ms'],answer:0,why:'Throughput = completed requests / elapsed time = 12 / 60 = 0.2 requests/ms. The inverse, 5 ms/request, has different units.',revisit:'bottle'},
        {q:'A consumer has no work in a shared queue. Which approach best avoids repeatedly wasting CPU time?',options:['Keep the mutex locked and spin forever.','Wait on an appropriate condition, release the mutex while waiting, then recheck the predicate after waking.','Add a second counter without synchronisation.'],answer:1,why:'A condition wait coordinates sleeping with releasing and later reacquiring the mutex. Recheck the queue condition in a loop. A mutex alone does not express “work is available”.',revisit:'dead'},
        {q:'CPU usage falls after adding a core but batch time is unchanged. Which conclusion is justified?',options:['The new CPU is broken.','The OS must be replaced.','The limiting resource may be elsewhere; inspect the device queue and completion times.'],answer:2,why:'OS-603 keeps total CPU work at 24 core-ms. More available core time lowers the utilisation percentage without shortening the serial device workload.',revisit:'bottle'}
      ]
    },
    7: {
      title: 'Files, devices and constrained systems',
      outcomes: ['Explain access checks and trace a cache-miss read through OS and device layers.', 'Compare buffering, backpressure and persistence using observed counts.', 'Evaluate deadline and memory constraints in an illustrative IoT controller.'],
      plan: [['Get ready and recap',10],['OS-701: files and access',30],['OS-702: device queues',30],['Take a screen break',5],['OS-703: constrained controller',30],['Knowledge check and export',15]],
      recap: 'From Week 6, remember that work can wait for a resource without using CPU time. This week follows that waiting through storage and device requests. You will then apply scheduling ideas to a small controller. No physical sensors, installation, command-line privileges or prior Linux experience are needed: the file permissions and controller are teaching models.',
      exit: 'An environmental logger must restrict access to reports, survive bursts of data and respond to a control deadline. Recommend one measure for each concern. Explain why a bigger buffer or a higher priority is not, by itself, a complete solution.',
      quiz: [
        {q:'In this POSIX-style model, what does directory x permission allow?',options:['Execution of every file inside it.','Searching/traversing that directory as part of a path.','Changing the device driver.'],answer:1,why:'Directory search permission permits path traversal. Listing names concerns directory r; reading file contents requires the file’s read permission as well.',revisit:'files'},
        {q:'Nine-slot buffer, continuous burst, then power cut after tick 4: 12 records accepted, 4 persisted. What happened to the other 8?',options:['They are safely on disk because accepted means durable.','They disappeared before reaching the buffer.','They were still in volatile memory and are lost in this model.'],answer:2,why:'Admission to RAM and completion on non-volatile storage are distinct events. The model has no flush, journal or power-loss protection.',revisit:'buffer'},
        {q:'What is the main purpose of a cache?',options:['Retain copies to satisfy later access efficiently.','Guarantee that no power failure can lose data.','Replace every access-control check.'],answer:0,why:'Caching reuses copies. Buffering handles rate mismatches, and spooling queues jobs. These roles can coexist but are not interchangeable.',revisit:'buffer'},
        {q:'Control releases at 10 ms, has a relative deadline of 2 ms and finishes at 13 ms. Is the deadline met?',options:['Yes, because the period is 5 ms.','No: the absolute deadline is 12 ms.','Yes, because total CPU utilisation is below 100%.'],answer:1,why:'Absolute deadline = release + relative deadline = 12 ms. Finishing at 13 ms is late, even if the CPU has idle time elsewhere.',revisit:'rtos'},
        {q:'Which description best fits the controller software?',options:['The phone app is the microcontroller’s kernel.','Firmware cannot include an operating system.','A firmware image may contain the RTOS, drivers and control application.'],answer:2,why:'Firmware describes software deployed for the device. An RTOS schedules tasks; drivers access hardware; application logic implements control policy. A phone interface can communicate with the controller.',revisit:'rtos'}
      ]
    }
  },
  lessons: {
    race: {
      minutes:30, aim:'Explain a lost update and the scope of the critical section.',
      learn:[['Shared state','Threads in one process share an address space, while retaining their own execution state and stacks. Here the shared counter is visible to both workers, but each worker’s temporary value is local. READ copies the counter, ADD changes the local copy, and WRITE replaces the shared value.'],['Critical section','A read–modify–write operation is not automatically indivisible. A mutex protects a section so only one cooperating worker enters it at a time. The protected section must include the dependent read and write, not just the final write. A lock can introduce waiting and must be used consistently.']],
      terms:[['Race','A result depends on the timing or ordering of concurrent operations.'],['Mutual exclusion','At most one cooperating execution path uses the protected section at a time.']],
      prediction:'Two workers each add one to a counter initially at zero. Predict the final value without a lock and explain your reasoning.',
      experiments:[
        {title:'Reproduce the fault',setup:{locked:false},check:'baseline',do:'Choose No lock, then Run competing workers. Read the six trace entries in order.',look:'Which value does each READ obtain? Which value does each WRITE store?'},
        {title:'Protect the complete update',setup:{locked:true},check:'fixed',do:'Choose Mutex around full update, then Run competing workers.',look:'Find the blocked worker and the first point at which it can READ. Compare the final shared value.'}
      ],
      debrief:'Unprotected: A reads 0, B reads 0, both add locally and both write 1. One increment is lost. Protected: A writes 1 before B reads; B then writes 2. Waiting makes this run correct, not necessarily faster. For an extension, reset with No lock and step A three times, then B three times: a serial run reaches 2, but one successful schedule does not establish safety for all interleavings.',
      transfer:'Would protecting only WRITE solve the fault? Explain using the two earlier READ operations. What cost might a long critical section impose on other users?',
      selfcheck:['I identified the two reads of the same old value.', 'I explained why the whole read–modify–write sequence needs protection.'],
      sources:[['OSTEP: threads','https://pages.cs.wisc.edu/~remzi/OSTEP/threads-intro.pdf'],['OSTEP: locks','https://pages.cs.wisc.edu/~remzi/OSTEP/threads-locks.pdf']]
    },
    dead: {
      minutes:25,aim:'Distinguish waiting from deadlock and evaluate coordination methods.',
      learn:[['A circular dependency','A lock owner can hold one resource while requesting another. Deadlock is possible when mutual exclusion, hold-and-wait, no resource pre-emption and circular wait coexist. CPU pre-emption alone does not reclaim a lock. In this two-lock model, the cycle leaves both workers unable to progress.'],['Beyond a mutex','A counting semaphore can represent available resource permits. A condition variable lets a thread wait for a predicate, such as a non-empty queue; waiting releases the associated mutex and reacquires it before returning. The predicate must be rechecked in a loop. These are different coordination needs.'],['Communication and costs','Processes can exchange messages through pipes, sockets or queues, or use shared memory with coordination. Message passing makes transfer explicit but can add copying and queueing; shared memory avoids some copies but requires careful ownership. A large lock is simpler yet can serialize unrelated work.']],
      terms:[['Starvation','A worker waits indefinitely because others keep being favoured. It need not form a deadlock cycle.'],['Livelock','Workers keep changing state in response to each other but fail to complete useful work.']],
      prediction:'A needs spool then log; B needs log then spool. What happens if each acquires its first lock before requesting its second?',
      experiments:[
        {title:'Locate the circular wait',setup:{ordered:false},check:'baseline',do:'Choose A: spool → log; B: log → spool, then Run workers.',look:'Write the dependency as A waits for B’s resource, and B waits for A’s resource.'},
        {title:'Use a common order',setup:{ordered:true},check:'fixed',do:'Choose Both: spool → log, then Run workers.',look:'Both finish. Which necessary condition has been removed? Which conditions still apply?'}
      ],
      debrief:'The opposing-order run ends with A holding spool and B holding log. Neither can acquire the other lock. Under common ordering, a worker waiting for spool has not already acquired log, so this cycle cannot form. Mutual exclusion still exists. Recovery by terminating work needs a policy for partial updates; a timeout alone is not proof of deadlock.',
      transfer:'Explain why an additional CPU would not release either lock. Compare prevention by ordering with detection and recovery, including one cost of each.',
      selfcheck:['I named all four necessary conditions and located this cycle.', 'I distinguished CPU pre-emption from reclaiming an owned resource.'],
      sources:[['OSTEP: concurrency problems','https://pages.cs.wisc.edu/~remzi/OSTEP/threads-bugs.pdf'],['OSTEP: condition variables','https://pages.cs.wisc.edu/~remzi/OSTEP/threads-cv.pdf'],['OSTEP: semaphores','https://pages.cs.wisc.edu/~remzi/OSTEP/threads-sema.pdf']]
    },
    bottle: {
      minutes:30,aim:'Use comparable measurements to identify a limiting resource.',
      learn:[['Define the workload','Twelve requests all arrive at t = 0. Each consumes 2 ms on a CPU, followed by a serial device operation. All requests must finish. Multiple concurrent users can create just such a queue, although real arrivals and request sizes vary. Change one resource at a time to make the comparison interpretable.'],['Choose a measure','Batch throughput is completions divided by elapsed time. CPU utilisation is busy core-time divided by available core-time. Device utilisation is device busy-time divided by elapsed time. Turnaround is completion minus arrival; with every arrival at zero, each listed completion time is also turnaround. A batch throughput figure does not describe every user’s latency.'],['Memory and I/O','A process waiting for a device can be blocked while other work uses the CPU. Memory pressure, paging and cache behaviour can also change the queue and response time. This model holds those effects constant; low CPU usage does not tell you which one is responsible in a real machine.']],
      terms:[['Contention','Work competes for a limited resource, causing waiting.'],['Bottleneck','The resource that limits completion for the stated workload and configuration.']],
      prediction:'Predict whether doubling CPU cores will halve the batch time when every request still needs 6 ms on one serial device.',
      experiments:[
        {title:'Measure the baseline',setup:{cores:1,disk:6},check:'baseline',do:'Set 1 core and 6 ms device service. Select Run batch.',look:'Record elapsed time, both utilisation values, throughput and the first/last request completion times.'},
        {title:'Add a core only',setup:{cores:2,disk:6},check:'extra',do:'Set 2 cores and keep device service at 6 ms. Run batch again.',look:'Compare total time with the baseline. Why has the CPU percentage fallen?'},
        {title:'Improve the device only',setup:{cores:1,disk:2},check:'fixed',do:'Return to 1 core and change device service to 2 ms. Run batch.',look:'Compare throughput and elapsed time with the baseline. Inspect the per-millisecond execution table.'}
      ],
      debrief:'Baseline: 74 ms, 12/74 = 0.162 requests/ms, CPU 32.4%, device 97.3%. Two cores with the same device: still 74 ms; 24 core-ms divided by 148 available core-ms gives 16.2% CPU use. Faster device with one core: 26 ms and 12/26 = 0.462 requests/ms. The original serial device dominates. These are deterministic simulated measurements, not benchmark results for Windows or Linux.',
      transfer:'Which change is supported by this workload? Name the arrival pattern, latency distribution, memory or device measurements you would need before making a real deployment recommendation.',
      selfcheck:['I compared the same workload and quoted units.', 'I explained why CPU utilisation and useful throughput are different.'],
      sources:[['OSTEP: I/O devices','https://pages.cs.wisc.edu/~remzi/OSTEP/file-devices.pdf']]
    },
    files: {
      minutes:30,aim:'Restore access without granting unnecessary rights and explain the read path.',
      learn:[['Names, contents and metadata','A file holds contents; metadata records properties such as owner, permissions and size. Directories associate names with file-system objects. Resolving a path requires walking its components. The permissions in this activity use owner/group/other classes; changing the visual theme does not convert the model to NTFS.'],['Search is not file execution','Directory x means search/traversal, whereas directory r permits reading its entries. File r allows content reading. The reader is a member of readers but not the owner. / already permits search. Both the /shared directory and report.txt must allow the relevant access.'],['A cache-miss read','After permission checks, the file system resolves data blocks. A driver submits a device request; the caller can wait while other work runs. In this example a completion interrupt makes the caller ready again; ready does not mean it immediately owns the CPU. Real cached reads may not require a device request.']],
      terms:[['Least privilege','Grant only the access needed for the role.'],['EACCES','A permission-denied error in this model. It does not mean the file is absent.']],
      prediction:'The reader has the file name, but no group access is granted. Where will lookup fail, and would allowing everyone to read meet the requirement?',
      experiments:[
        {title:'Observe the denial',setup:{policy:'original'},check:'baseline',do:'Keep original permissions and select Test reader and guest.',look:'Find the first failing access check. Has any data request reached the device?'},
        {title:'Try an over-broad remedy',setup:{policy:'everyone'},check:'unsafe',do:'Choose Everyone: directory x + file r, then test again.',look:'Reader succeeds, but inspect Guest as well. Functionality alone is not enough.'},
        {title:'Apply the least-privilege remedy',setup:{policy:'group'},check:'fixed',do:'Choose Group: directory x + file r and test again.',look:'Reader should be allowed and Guest denied. Follow the successful cache-miss trace.'}
      ],
      debrief:'Originally, /shared denies group search, so lookup stops before a file-content device request. Group x on /shared and group r on report.txt lets the reader traverse and read while denying the guest. Granting the same rights to everyone is a functional but over-broad solution. The model omits ACLs, links and mandatory security policies; it is not a real chmod exercise.',
      transfer:'Explain each layer’s role in the successful trace. Why would changing a driver be the wrong first response to EACCES?',
      selfcheck:['I distinguished directory search from file read.', 'I checked the guest outcome and explained the application-to-device path.'],
      sources:[['Linux: path resolution','https://man7.org/linux/man-pages/man7/path_resolution.7.html'],['OSTEP: files and directories','https://pages.cs.wisc.edu/~remzi/OSTEP/file-intro.pdf']]
    },
    buffer: {
      minutes:30,aim:'Distinguish burst handling, flow control and durability.',
      learn:[['Why a queue fills','The producer generates three records per tick but the device writes one. A finite buffer can absorb a short burst. Here admission occurs before the tick’s drain. If input continues indefinitely above device capacity, adding memory only delays overflow. Backpressure makes the producer wait rather than dropping records.'],['Three different roles','Buffering smooths a rate mismatch; caching keeps copies for reuse; spooling queues jobs, such as documents for a printer. A record accepted into volatile RAM is not necessarily persisted. The distinction matters when a program reports a write as successful.'],['Device coordination','Polling repeatedly checks device status. Interrupts let a device notify the processor, with handling overhead. DMA transfers data without the CPU copying each byte, but drivers and memory ownership still require coordination. None of these mechanisms alone makes a volatile queue durable.']],
      terms:[['Volatile','Contents are not retained when power is lost.'],['Backpressure','A downstream limit causes upstream work to wait or slow down.']],
      prediction:'Twelve records arrive over four ticks. What might a larger buffer improve, and what could still go wrong at a power cut?',
      experiments:[
        {title:'Observe overflow',setup:{capacity:2,policy:'drop',cut:false},check:'baseline',do:'Use 2 records, Drop unaccepted records and Continuous power. Run logger.',look:'Compare Generated, Accepted and Persisted. How many were never admitted?'},
        {title:'Absorb the finite burst',setup:{capacity:9,policy:'drop',cut:false},check:'fixed',do:'Use 9 records with continuous power and drop policy. Run logger.',look:'Follow the drain after arrivals stop. Does the device write more than one record per tick?'},
        {title:'Keep the small buffer with backpressure',setup:{capacity:2,policy:'wait',cut:false},check:'backpressure',do:'Use 2 records and Backpressure: hold at producer, with continuous power. Run logger.',look:'Inspect Producer waiting. The model assumes unlimited upstream holding capacity; real systems may block, reject or time out.'},
        {title:'Cut power with accepted data outstanding',setup:{capacity:9,policy:'drop',cut:true},check:'extra',do:'Use 9 records, drop policy, and Cut after tick 4 drain. Run logger.',look:'Compare 12 accepted with the persisted and lost counts. Power loss happens after that tick’s write.'}
      ],
      debrief:'Small buffer with dropping: 5 accepted and persisted, 7 dropped. Nine slots: all 12 eventually persist. Small buffer with backpressure: all 12 persist, but work waits upstream. Nine slots with power cut after tick 4: 4 persist and 8 accepted records are lost. The larger buffer improves burst handling, not the one-record-per-tick device rate or power-loss protection.',
      transfer:'Compare the memory cost of a larger buffer with the latency and upstream-storage costs of backpressure. What additional guarantees would a durable logger need?',
      selfcheck:['I compared capacity and backpressure, including their costs.', 'I separated generated, accepted, persisted, dropped and lost counts.'],
      sources:[['OSTEP: I/O devices','https://pages.cs.wisc.edu/~remzi/OSTEP/file-devices.pdf'],['OSTEP: persistent storage interface','https://pages.cs.wisc.edu/~remzi/OSTEP/file-intro.pdf']]
    },
    rtos: {
      minutes:30,aim:'Evaluate a constrained system using both timing and memory evidence.',
      learn:[['Deadlines are part of correctness','In this illustrative controller, control tasks release every 5 ms, need 1 ms of CPU and must complete within 2 ms of release. Telemetry needs 3 ms each period. The scheduler runs the highest-priority ready job and may pre-empt a lower-priority one. An idle CPU later cannot repair a missed earlier deadline.'],['Firmware and the RTOS','A firmware image can contain startup code, drivers, an RTOS kernel and application logic. The RTOS provides scheduling and coordination; a driver talks to a sensor or actuator; the application chooses the control response. A phone running iOS could present a remote interface, while the controller runs its own embedded software.'],['Fit and assurance','The RAM model reserves 32 KiB for the platform and two 8 KiB stacks before allocating queue blocks. Real designs also need stack headroom, bounded execution times, interrupt and blocking analysis, energy budgets and safe failure behaviour. A low-priority lock owner can block a higher-priority task; priority inheritance can mitigate this inversion but does not eliminate every timing hazard.']],
      terms:[['Relative deadline','Maximum allowed time from job release to completion.'],['RTOS','An operating system intended to support predictable timing; the application still needs analysis.']],
      prediction:'Total task demand is 4 ms per 5 ms period. Does that alone guarantee the 2 ms control deadline? Predict the effect of priority and queue memory.',
      experiments:[
        {title:'Run telemetry first',setup:{priority:'telemetry',samples:2},check:'baseline',do:'Use Telemetry and 2 × 4 KiB blocks. Boot and run 20 ms.',look:'For the first control job, compare release, absolute deadline and finish time.'},
        {title:'Exceed available RAM',setup:{priority:'control',samples:8},check:'extra',do:'Use Control and 8 × 4 KiB blocks. Boot and run.',look:'Explain why a deadline count is shown as a dash, not zero misses.'},
        {title:'Meet both constraints',setup:{priority:'control',samples:2},check:'fixed',do:'Use Control and 2 × 4 KiB blocks. Boot and run 20 ms.',look:'Calculate 32 + 16 + 8 KiB and compare every control finish with its deadline.'}
      ],
      debrief:'Telemetry first yields four control deadline misses despite 80% total CPU demand. Control first finishes each control job one millisecond after release in this model. Two queue blocks require 56 KiB, leaving 8 KiB; eight blocks require 80 KiB and prevent boot. Four blocks exactly fill the 64 KiB budget, leaving no modelled headroom. A successful 20 ms trace does not prove a real air-conditioning system safe or schedulable under other conditions.',
      transfer:'Recommend a priority and queue setting for this workload. Distinguish evidence from this trace from the extra timing, memory and fault-handling evidence required on real hardware.',
      selfcheck:['I calculated an absolute deadline and the RAM requirement.', 'I separated RTOS, firmware, driver and application roles and limited my conclusion to this workload.'],
      sources:[['FreeRTOS: scheduling','https://www.freertos.org/Documentation/02-Kernel/02-Kernel-features/01-Tasks-and-co-routines/04-Task-scheduling'],['FreeRTOS: mutexes and priority inheritance','https://freertos.org/Documentation/02-Kernel/02-Kernel-features/02-Queues-mutexes-and-semaphores/04-Mutexes']]
    }
  }
};
if(typeof module!=='undefined')module.exports=Course;

const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cases=[
 {id:'race',week:6,code:'OS-601',title:'The missing update',module:'Threads & shared memory',brief:'Two booking workers each record one arrival. Both finish, but the shared counter sometimes increases only once. Reproduce the fault, then protect the whole update.',target:'Capture an unprotected lost update and a protected run ending at 2.',question:'What makes the protected result reliable in this model?',choices:['The CPU runs both threads simultaneously','The mutex makes the entire read–modify–write section mutually exclusive','Writing alone is protected; the read can remain outside'],answer:1,hint:'Both workers can read the same old value before either writes. Which operations must stay together?',deeper:'A mutex provides mutual exclusion, not automatic speed. A contending worker may block or spin depending on implementation. Atomic read–modify–write operations are another option for suitable data. This model treats lock acquisition as atomic and does not model memory-ordering rules.',prompt:'Use the trace to explain the lost update, identify the critical section, and discuss one cost or limitation of the remedy.',source:'threads-locks.pdf'},
 {id:'dead',week:6,code:'OS-602',title:'Both workers are waiting',module:'Locks & deadlock',brief:'A print worker and an audit worker each need the spool lock and the log lock. Their lock order differs. Neither finishes, although the CPU has spare capacity.',target:'Capture circular wait, then complete both workers using one global lock order.',question:'Which necessary deadlock condition does the shared ordering remove?',choices:['Mutual exclusion','No pre-emption','Circular wait'],answer:2,hint:'Compare who owns each lock with who is waiting for it. Adding another CPU does not release a lock.',deeper:'The four necessary conditions are mutual exclusion, hold-and-wait, no pre-emption of resources, and circular wait. CPU pre-emption is not the same as reclaiming an owned lock. Prevention changes the rules; detection and recovery deal with deadlock after it occurs. A consistent total order must be respected by every relevant code path.',prompt:'Name the four conditions, use this trace to locate the cycle, then explain a limitation of ordering or an alternative recovery policy.',source:'threads-bugs.pdf'},
 {id:'bottle',week:6,code:'OS-603',title:'More cores, same delay',module:'Resource efficiency',brief:'Twelve requests arrive together. Each needs 2 ms of CPU service followed by 6 ms on one serial storage device. Investigate whether adding a CPU core addresses the bottleneck.',target:'Run the baseline, test two CPU cores, then test faster storage with one core.',question:'What best explains the results for this workload?',choices:['The serial device limits completion; CPU utilisation alone is not the objective','Low CPU utilisation proves the OS is faulty','Doubling cores must halve elapsed time'],answer:0,hint:'Track completed requests and device utilisation. Keep the workload fixed when comparing configurations.',deeper:'This is a closed batch with unlimited queue capacity, no caching, no overhead and no contention outside the model. Throughput is completed requests divided by total elapsed time. A small CPU change need not improve a device-bound service. Real systems require measured workloads, latency distributions and repeated observations.',prompt:'Quote baseline and changed elapsed time and throughput. Explain why the preferred change works, and what real-system evidence you would need before recommending it.',source:'file-devices.pdf'},
 {id:'files',week:7,code:'OS-701',title:'The report cannot be opened',module:'Files & access control',brief:'A staff reader belongs to the readers group. The report is present, but opening /shared/report.txt fails. Restore the required access without exposing the file to a guest.',target:'Capture the denial; grant group search on the directory and group read on the file; keep guest access denied.',question:'Why is file read permission alone insufficient?',choices:['Every file must be executable to read it','The kernel also checks search permission on the directories in the path','A driver grants file permissions after reading the disk'],answer:1,hint:'Directory search (x) permits path traversal. Directory read (r) concerns listing names; it is not the same operation.',deeper:'This is a simplified POSIX-style access model, not NTFS. Owner is the administrator; the reader uses group permissions and the guest uses other permissions. / already allows search. ACLs, capabilities, links, mounts and mandatory controls are omitted. Metadata includes ownership, permissions, size and times; file contents are a separate concern.',prompt:'Explain the failed path lookup, justify the least-privilege change, and trace the successful cache-miss read from application to device and back.',source:'file-intro.pdf'},
 {id:'buffer',week:7,code:'OS-702',title:'Accepted is not persisted',module:'Devices & I/O queues',brief:'A logger produces 3 records per tick for 4 ticks. Storage writes 1 record per tick. A two-record volatile buffer loses data when full. Investigate a larger buffer, backpressure and a power cut.',target:'Capture overflow, complete a loss-free run, and run a power-cut experiment.',question:'What does a successful buffered write acceptance establish here?',choices:['The record is already on non-volatile storage','A larger buffer permanently increases device throughput','The record entered volatile memory; persistence still requires device completion'],answer:2,hint:'Each tick admits records before draining one. Watch accepted, persisted and lost counts separately.',deeper:'Buffering absorbs bursts; caching retains copies for reuse; spooling queues complete jobs for a device. Interrupts let a device signal completion; polling repeatedly checks its status. DMA can transfer blocks without CPU copying each byte, but still requires coordination. This model has no journalling, flush operation, device cache or power-loss protection.',prompt:'Compare capacity and backpressure as responses to the burst. Use the power-cut counts to explain durability and one limitation of this simplified device model.',source:'file-devices.pdf'},
 {id:'rtos',week:7,code:'OS-703',title:'The controller responds too late',module:'Constrained systems',brief:'An illustrative air-conditioning controller has 64 KiB RAM and one CPU. Control and telemetry jobs arrive every 5 ms. Control needs 1 ms and must finish within 2 ms of release; telemetry needs 3 ms.',target:'Capture missed control deadlines, exceed the memory budget once, then find a configuration that boots and meets all control deadlines.',question:'Which statement is supported by the successful run?',choices:['Any high-priority task always meets its deadline','This stated workload meets deadlines; blocking, interrupts and execution-time variation still need analysis','An RTOS is separate from all firmware'],answer:1,hint:'A response deadline concerns completion after release. Priority changes the order; queue capacity consumes memory.',deeper:'The model uses fixed-priority pre-emptive scheduling with zero switch cost and no blocking. It illustrates concepts relevant to a configured FreeRTOS system; it does not execute FreeRTOS. The firmware image may contain an RTOS, application logic and drivers. iOS could host a remote control app but is not this microcontroller OS. Priority inversion, watchdog design, safe actuator states and energy use need separate engineering.',prompt:'Compare deadlines and the RAM budget. Explain why the successful trace is not a general real-time guarantee and distinguish firmware, RTOS, driver and application responsibilities.',source:'https://www.freertos.org/Documentation/02-Kernel/02-Kernel-features/01-Tasks-and-co-routines/04-Task-scheduling'}
];
const KEY='riverside-os-lab-v1';
const routes=['home','week6','week7','check6','check7','report','library',...cases.map(c=>c.id)];
let progress={version:1,name:'',records:{},weeks:{},route:'home'},storageOK=true,current='home',sim={},feedback='',loadError='',rawRecovery='',restoring=false;
function cleanModel(id,m){
 if(!m||typeof m!=='object')return null;
 if(id==='race'||id==='dead')return {locked:m.locked===true,ordered:m.ordered===true,events:Array.isArray(m.events)?m.events.filter(x=>x===0||x===1).slice(0,100):[]};
 if(id==='bottle')return {cores:m.cores===2?2:1,disk:m.disk===2?2:6,ran:m.ran===true};
 if(id==='files')return {policy:['original','group','everyone'].includes(m.policy)?m.policy:'original',ran:m.ran===true};
 if(id==='buffer')return {capacity:m.capacity===9?9:2,policy:m.policy==='wait'?'wait':'drop',cut:m.cut===true,ran:m.ran===true};
 if(id==='rtos')return {priority:m.priority==='control'?'control':'telemetry',samples:[2,4,8].includes(m.samples)?m.samples:2,ran:m.ran===true};
 return null;
}
function validateImport(p){
 if(!p||p.version!==1||typeof p.name!=='string'||!p.records||typeof p.records!=='object'||Array.isArray(p.records))throw Error('This is not a Riverside OS Lab progress file.');
 const clean={version:1,name:p.name.slice(0,80),records:{},weeks:{},route:routes.includes(p.route)?p.route:'home'};
 for(const c of cases){const r=p.records[c.id];if(!r)continue;if(typeof r!=='object'||Array.isArray(r))throw Error('Invalid investigation record.');
  const d=clean.records[c.id]={note:typeof r.note==='string'?r.note.slice(0,12000):'',prediction:typeof r.prediction==='string'?r.prediction.slice(0,3000):'',choice:Number.isInteger(r.choice)&&r.choice>=0&&r.choice<3?r.choice:null,checks:{},snapshots:[],score:0,phase:['learn','experiment','explain'].includes(r.phase)?r.phase:'learn',review:Array.from({length:3},(_,i)=>r.review?.[i]===true),model:cleanModel(c.id,r.model)};
  for(const k of required(c.id))d.checks[k]=r.checks?.[k]===true;
  if(Array.isArray(r.snapshots))d.snapshots=r.snapshots.slice(-16).filter(x=>x&&typeof x.label==='string'&&typeof x.evidence==='string').map(x=>({label:x.label.slice(0,120),evidence:x.evidence.slice(0,18000)}));
  if(r.score===100&&eligible(c,d))d.score=100;
 }
 for(const w of [6,7]){const r=p.weeks?.[w]||{};clean.weeks[w]={answers:Course.weeks[w].quiz.map((q,i)=>Number.isInteger(r.answers?.[i])&&r.answers[i]>=0&&r.answers[i]<q.options.length?r.answers[i]:null),checked:r.checked===true,reflection:typeof r.reflection==='string'?r.reflection.slice(0,6000):'',reviewed:r.reviewed===true};}
 return clean;
}
try{rawRecovery=localStorage.getItem(KEY)||'';if(rawRecovery)progress=validateImport(JSON.parse(rawRecovery));}catch(e){loadError='Saved progress could not be read. Download a recovery copy or import a valid backup before starting again.';storageOK=false;}
function rec(id=current){return progress.records[id]||(progress.records[id]={note:'',prediction:'',choice:null,checks:{},snapshots:[],score:0,phase:'learn',review:[false,false,false],model:null});}
function weekRec(w){return progress.weeks[w]||(progress.weeks[w]={answers:Course.weeks[w].quiz.map(()=>null),checked:false,reflection:'',reviewed:false});}
function rememberModel(){if(!cases.some(c=>c.id===current)||restoring)return;rec().model=cleanModel(current,{...sim,ran:!!sim.result});}
function save(){
 if(!loadError){rememberModel();progress.route=current;try{localStorage.setItem(KEY,JSON.stringify(progress));storageOK=true;}catch{storageOK=false;}}
 const el=$('saveState');if(el)el.textContent=loadError?'Recovery needed · original data preserved':storageOK?'Saved in this browser · export before changing PCs':'Browser storage unavailable · export before closing';
}
function required(id){return Course.lessons[id].experiments.map(e=>e.check);}
function eligible(c,r){return required(c.id).every(k=>r.checks[k])&&r.choice===c.answer&&r.note.trim().length>=80&&r.review?.every(Boolean)&&r.review.length===3;}
function capture(flag,label,evidence){const r=rec();if(flag)r.checks[flag]=true;const old=r.snapshots.findIndex(x=>x.label===label);if(old>=0)r.snapshots.splice(old,1);r.snapshots.push({label,evidence});r.snapshots=r.snapshots.slice(-16);save();}
function init(id){if(id==='race')sim={...Models.race(false),events:[]};if(id==='dead')sim={...Models.deadlock(false),events:[]};if(id==='bottle')sim={cores:1,disk:6,result:null};if(id==='files')sim={policy:'original',result:null};if(id==='buffer')sim={capacity:2,policy:'drop',cut:false,result:null};if(id==='rtos')sim={priority:'telemetry',samples:2,result:null};}
function restoreModel(id){restoring=true;init(id);const m=rec(id).model;if(m){if(id==='race'||id==='dead'){sim=id==='race'?Models.race(m.locked):Models.deadlock(m.ordered);sim.events=[...m.events];for(const i of m.events)(id==='race'?Models.raceStep:Models.deadStep)(sim,i);}else{Object.assign(sim,m);if(m.ran)sim.result=id==='bottle'?Models.pipeline(sim.cores,sim.disk):id==='files'?Models.permissions(sim.policy):id==='buffer'?Models.buffer(sim.capacity,sim.policy,sim.cut):Models.controller(sim.priority,sim.samples);}}restoring=false;}
function nav(id){if(!routes.includes(id))return;save();current=id;if(location.hash!=='#'+id)history.pushState(null,'','#'+id);feedback='';if(cases.some(c=>c.id===id))restoreModel(id);render();document.body.classList.remove('menuopen');$('menu').setAttribute('aria-expanded','false');window.scrollTo(0,0);$('main').focus({preventScroll:true});}
function phase(name){rec().phase=name;feedback='';render();$('main').focus({preventScroll:true});window.scrollTo(0,0);}
function metrics(arr){return `<div class="metrics">${arr.map(([k,v])=>`<div class="metric"><span>${k}</span><strong>${v}</strong></div>`).join('')}</div>`;}
function trace(lines){return lines.length?`<ol class="trace" aria-label="Execution trace">${lines.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="empty">Run the model to collect an execution trace.</p>';}
function select(id,label,values,value){return `<div><label for="${id}">${label}</label><select id="${id}">${values.map(([v,t])=>`<option value="${v}" ${String(v)===String(value)?'selected':''}>${t}</option>`).join('')}</select></div>`;}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map((h,i)=>`<th${i?' class="num"':''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="num"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function raceView(){return `<h2>Shared counter</h2><p class="small">Two workers · one increment each · sequentially consistent teaching model</p>${metrics([['Shared value',sim.value],['Expected at completion',2],['Mutex owner',sim.owner===null?'–':['A','B'][sim.owner]]])}<div class="controls">${select('lock','Protection',[[0,'No lock'],[1,'Mutex around full update']],sim.locked?1:0)}<button id="resetSim">Reset model</button><button id="run" class="primary">Run competing workers</button></div><div class="steps">${['A','B'].map((n,i)=>`<div class="thread"><strong>Worker ${n}</strong><p>Next: ${['READ shared','ADD locally','WRITE shared','Finished'][sim.pc[i]]}<br>Local value: ${sim.local[i]??'–'}</p><button data-thread="${i}" ${sim.pc[i]===3?'disabled':''}>Step worker ${n}</button></div>`).join('')}</div>${trace(sim.log)}`;}
function deadView(){return `<h2>Resource ownership</h2>${table(['Resource','Owner'],[['Spool lock',sim.owners[0]===null?'Free':['A','B'][sim.owners[0]]],['Log lock',sim.owners[1]===null?'Free':['A','B'][sim.owners[1]]]])}<div class="controls">${select('order','Acquisition order',[[0,'A: spool → log; B: log → spool'],[1,'Both: spool → log']],sim.ordered?1:0)}<button id="resetSim">Reset model</button><button id="run" class="primary">Run workers</button></div><div class="steps">${['A','B'].map((n,i)=>`<div class="thread"><strong>Worker ${n}</strong><p>${sim.pc[i]===3?'Completed':`Acquired ${sim.pc[i]} of 2 locks`}</p><button data-thread="${i}" ${sim.pc[i]===3?'disabled':''}>Step worker ${n}</button></div>`).join('')}</div><p class="notice">${Models.isDead(sim)?'Circular wait: A waits for B’s log lock; B waits for A’s spool lock.':sim.pc.every(x=>x===3)?'Both workers completed and released their resources.':'Inspect ownership, then advance either worker.'}</p>${trace(sim.log)}`;}
function bottleView(){const r=sim.result;return `<h2>Batch workload</h2><p>12 requests at t = 0. Each uses CPU for 2 ms, then the serial device. Device service starts on the next tick after CPU completion.</p><div class="controls">${select('cores','CPU cores',[[1,'1 core'],[2,'2 cores']],sim.cores)}${select('disk','Device service per request',[[6,'6 ms'],[2,'2 ms']],sim.disk)}<button id="run" class="primary">Run batch</button></div>${r?`${metrics([['Elapsed',r.elapsed+' ms'],['Throughput',r.throughput.toFixed(3)+' requests/ms'],['CPU utilisation',r.cpuUtil.toFixed(1)+'%'],['Device utilisation',r.diskUtil.toFixed(1)+'%']])}${table(['Request','Completion (ms)'],r.jobs.map(j=>['Request '+j.id,j.finish]))}<details><summary>Inspect per-millisecond execution</summary>${table(['Time (ms)','CPU job(s)','Device job','Queued for device'],r.timeline.map(x=>[x.start,x.cpu,x.disk,x.queue]))}</details>`:'<p class="empty">Run the baseline before changing the resources.</p>'}`;}
function filesView(){const r=sim.result;return `<h2>File access inspector</h2>${table(['Object','Owner','Group','Original permissions'],[['/shared','admin','readers','rwx------'],['report.txt','admin','readers','rw-------']])}<p class="small">Reader is not the owner; reader belongs to readers. Guest belongs to neither. This is an intentionally restricted POSIX-style model.</p><div class="controls">${select('policy','Access change',[['original','Keep original permissions'],['group','Group: directory x + file r'],['everyone','Everyone: directory x + file r']],sim.policy)}<button id="run" class="primary">Test reader and guest</button></div>${r?metrics([['Reader',r.allowed?'Allowed':'Denied'],['Guest',r.guestAllowed?'Allowed':'Denied']]):''}<div class="flow">${['Application','Kernel / access','File system','Driver','Device'].map(n=>`<span>${n}</span>`).join('')}</div>${trace(r?.log||[])}`;}
function bufferView(){const r=sim.result;return `<h2>Volatile write buffer</h2><p class="small">Ticks 1–4: 3 new records/tick. Admission precedes device drain: 1 record/tick. Power cut stops the model after tick 4.</p><div class="controls">${select('capacity','Buffer capacity',[[2,'2 records'],[9,'9 records']],sim.capacity)}${select('backpressure','When buffer is full',[['drop','Drop unaccepted records'],['wait','Backpressure: hold at producer']],sim.policy)}${select('cut','Power supply',[[0,'Continuous power'],[1,'Cut after tick 4 drain']],sim.cut?1:0)}<button id="run" class="primary">Run logger</button></div>${r?`${metrics([['Generated',r.generated],['Accepted',r.accepted],['Persisted',r.persisted],['Dropped / lost',`${r.dropped} / ${r.lost}`]])}${table(['Tick','New','Admitted','Buffer','Producer waiting','Persisted'],r.rows.map(x=>[x.t,x.arrived,x.accepted,x.queue,x.pending,x.persisted]))}<p class="notice">${r.cut?`${r.lost} accepted records were lost from volatile memory; ${r.pending} records remained at the producer. No automatic restart is modelled.`:`${r.persisted} records persisted; ${r.dropped} dropped; ${r.queue} buffered; ${r.pending} waiting at producer.`}</p>`:'<p class="empty">Run the small-buffer baseline to observe overflow.</p>'}`;}
function rtosView(){const r=sim.result;return `<h2>Air-conditioning controller</h2><p class="small">One CPU · 20 ms window · fixed-priority pre-emption · control 1 ms / period 5 ms / relative deadline 2 ms · telemetry 3 ms / period 5 ms</p><div class="controls">${select('priority','Higher-priority task',[['telemetry','Telemetry'],['control','Control']],sim.priority)}${select('samples','Queue allocation',[[2,'2 × 4 KiB blocks'],[4,'4 × 4 KiB blocks'],[8,'8 × 4 KiB blocks']],sim.samples)}<button id="run" class="primary">Boot and run 20 ms</button></div><p>RAM = 32 KiB platform + 2 × 8 KiB task stacks + queue allocation. Available: 64 KiB. Blocks are illustrative allocations, not a claim that a temperature reading occupies 4 KiB.</p>${r?`${metrics([['RAM required',r.memory+' KiB'],['Boot',r.boot?'Ready':'Rejected'],['Control misses',r.boot?r.misses:'–']])}<div class="bar" aria-label="RAM ${r.memory} of 64 KiB"><span style="width:${Math.min(100,r.memory/64*100)}%"></span></div>${r.boot?`<div class="tablewrap"><div class="timeline">${r.rows.map(x=>`<div class="tick ${x.task==='Control'?'control':''}" title="${x.t}–${x.t+1} ms: ${x.task}">${x.task[0]}<span>${x.t}</span></div>`).join('')}</div></div><p class="legend">C = Control · T = Telemetry · I = Idle. Each cell spans 1 ms; final cell ends at 20 ms.</p>${table(['Control release (ms)','Deadline (ms)','Finished (ms)','Result'],r.jobs.filter(j=>j.name==='Control').map(j=>[j.release,j.deadline,j.finish,j.finish<=j.deadline?'Met':'Missed']))}`:'<p class="notice">Requested allocation exceeds available RAM. No task executes; a deadline count would be meaningless.</p>'}`:'<p class="empty">Run the original telemetry-first configuration.</p>'}`;}
function checkLabels(id){return Object.fromEntries(Course.lessons[id].experiments.map(e=>[e.check,e.title+' captured']));}
function lessonSources(l){return `<p class="small">Sources: ${l.sources.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join(' · ')}. Linked reading is optional for the core route and requires internet access.</p>`;}
function notebook(r){return `<section class="panel"><h2>Evidence notebook</h2><p class="small">Snapshots update automatically when you run experiments. Reset model and Set up this run keep your written work and captured evidence.</p>${r.snapshots.length?r.snapshots.map((s,i)=>`<details id="evidence-${i}"><summary>${i+1}. ${esc(s.label)}</summary><pre class="reporttext">${esc(s.evidence)}</pre></details>`).join(''):'<p>No evidence yet. Start the first experiment and use its Run button.</p>'}</section>`;}
function investigation(c){const r=rec(),l=Course.lessons[c.id];return `<header class="case"><div><p class="eyebrow">Week ${c.week} / ${c.code} / approximately ${l.minutes} minutes</p><h1>${c.title}</h1><p class="brief">${l.aim}</p></div><button data-nav="week${c.week}">Week ${c.week} route</button></header><div class="stage-nav" aria-label="Investigation stages">${[['learn','1. Learn & predict'],['experiment','2. Experiment'],['explain','3. Explain & review']].map(([id,t])=>`<button data-phase="${id}" aria-current="${r.phase===id?'step':'false'}">${t}</button>`).join('')}</div>
 ${r.phase==='learn'?`<section class="panel reading"><h2>Before you run the model</h2><p>${c.brief}</p>${l.learn.map(([t,p])=>`<h3>${t}</h3><p>${p}</p>`).join('')}<dl>${l.terms.map(([t,d])=>`<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl>${lessonSources(l)}</section><section class="panel"><h2>Make a prediction</h2><label for="prediction">${l.prediction}</label><textarea id="prediction" maxlength="3000" maxlength="3000" placeholder="My prediction is… because…">${esc(r.prediction)}</textarea><p class="small">This is saved, not graded. A mistaken prediction is useful when you explain why the evidence changed your mind.</p><button data-phase="experiment" class="primary">Continue to experiments</button></section>`:''}
 ${r.phase==='experiment'?`<p class="notice">Follow the numbered experiments. Set up this run chooses the settings; you still press Run and inspect the result. You can also change the controls yourself.</p><div class="grid"><section class="panel" id="modelPanel" tabindex="-1">${({race:raceView,dead:deadView,bottle:bottleView,files:filesView,buffer:bufferView,rtos:rtosView}[c.id])()}<div class="feedback" role="status">${esc(feedback)}</div></section><section class="panel"><h2>Your experiments</h2><ol class="experiment-list">${l.experiments.map((e,i)=>`<li><h3>${e.title}</h3><p class="check-state">${r.checks[e.check]?'✓ Evidence captured':'○ Not captured yet'}</p><p>${e.do}</p><p class="small"><strong>Look for:</strong> ${e.look}</p><button data-setup="${i}">Set up run ${i+1}</button></li>`).join('')}</ol><details id="hint"><summary>Stuck? Show a diagnostic hint</summary><p>${c.hint}</p><p>If your numbers differ from the worked debrief, use Set up run to restore that experiment, then Run. Manual worker steps can produce a different valid interleaving.</p></details><button data-phase="explain" class="primary">Continue to explanation</button></section></div>${notebook(r)}`:''}
 ${r.phase==='explain'?`<section class="panel reading"><h2>Compare and interpret</h2><p><strong>Your prediction:</strong> ${esc(r.prediction||'No prediction recorded.')}</p><details id="debrief"><summary>Reveal the worked debrief after comparing your runs</summary><p>${l.debrief}</p></details><details id="limits"><summary>Mechanism and model limits</summary><p>${c.deeper}</p></details><p><strong>Apply the idea:</strong> ${l.transfer}</p><ul>${l.selfcheck.map(x=>`<li>${x}</li>`).join('')}</ul>${lessonSources(l)}</section><section class="panel"><h2>Explain your evidence</h2><p>${c.prompt}</p><label for="reason">Your analysis (at least 80 characters)</label><textarea id="reason" maxlength="12000" maxlength="12000" placeholder="In the baseline… After changing… This happened because… A limitation is…">${esc(r.note)}</textarea><p class="small">Aim for one or two supported paragraphs. Length alone does not show understanding.</p><label for="diagnosis">${c.question}</label><select id="diagnosis" style="width:100%"><option value="">Select your conclusion</option>${c.choices.map((x,i)=>`<option value="${i}" ${r.choice===i?'selected':''}>${x}</option>`).join('')}</select><fieldset><legend>Review your own explanation</legend>${Course.review.map((t,i)=>`<label class="check-label"><input type="checkbox" data-review="${i}" ${r.review?.[i]?'checked':''}> ${t}</label>`).join('')}</fieldset><p class="small">Points record the experiments, conclusion and your self-review. The app cannot grade the quality of your prose. Ask your tutor about anything still unclear.</p><button id="submit" class="primary">Check investigation</button><div class="feedback" id="completionFeedback" role="status">${esc(feedback||(r.score?'100 practice points recorded. Your self-review is complete.':''))}</div></section>${notebook(r)}`:''}
 <div class="controls"><button data-nav="${cases.indexOf(c)===2?'check6':cases[cases.indexOf(c)+1]?.id||'check7'}">${cases.indexOf(c)===2?'Continue to Week 6 check':cases.indexOf(c)===5?'Continue to Week 7 check':'Next investigation'}</button><button id="startOver">Restart this investigation</button></div>`;}

function library(){return `<h1>Lab handbook</h1><p class="brief">Riverside OS Lab is an original teaching simulation for Unit 50, Level 5. It models selected mechanisms, not a complete operating system. All workloads, timings and device capacities are illustrative.</p><section class="panel"><h2>How to investigate</h2><ol><li>Predict what will happen before running the original configuration.</li><li>Reproduce the fault and inspect the trace.</li><li>Change one relevant variable and compare the outcome.</li><li>Explain the mechanism, trade-off and limits using the captured evidence.</li></ol><p>Each investigation awards 100 practice points once its experiments, conclusion, written response and self-review are complete. Editing the response requires a new self-review. Week checks and final reflections are recorded separately. Retrying never duplicates points. Text length only confirms that a response exists; it does not establish its quality.</p><p>Nothing you click changes a real OS, file permission or device. Later LO3 work must demonstrate real commands in the approved environments.</p></section><section class="panel"><h2>Sources and further reading</h2><ul class="resources"><li>Arpaci-Dusseau, R. H. and Arpaci-Dusseau, A. C. (2023). <em>Operating Systems: Three Easy Pieces</em>, version 1.10. <a href="https://pages.cs.wisc.edu/~remzi/OSTEP/" target="_blank" rel="noopener">Author-hosted textbook</a>. Chapters 26, 28, 30–32, 36 and 39 support the lecture principles.</li><li><a href="https://man7.org/linux/man-pages/man7/path_resolution.7.html" target="_blank" rel="noopener">Linux manual: path_resolution(7)</a> — search permissions and access failure.</li><li><a href="https://www.freertos.org/Documentation/02-Kernel/02-Kernel-features/01-Tasks-and-co-routines/04-Task-scheduling" target="_blank" rel="noopener">FreeRTOS task scheduling</a> — implementation context; our controller is not an emulator.</li></ul><p class="small">Sources consulted 5 November 2026. The simulations and their numerical datasets are original teaching examples.</p></section><section class="panel"><h2>Progress and access</h2><p>Your name or alias, notes and traces stay in this browser. There is no login, teacher dashboard or central leaderboard. Other people using this browser profile may see this work. Export progress before changing PCs. Import replaces the current local record after confirmation; it does not merge records.</p><p>Use buttons with a mouse or keyboard. All traces have text or table equivalents. On small screens, use Menu to switch investigations. The single-file download works offline; reference links require internet access.</p><p><a href="Riverside_OS_Lab_Offline.html" download>Download the offline lab</a> · <a href="https://sean-p-clohessy.github.io/riverside-os-lab/resources.html">Week 6 and 7 teaching resources</a></p></section>`;}

function home(){return `<header class="case"><div><p class="eyebrow">Unit 50 · Level 5 · Self-guided study</p><h1>Operating systems, one investigation at a time</h1><p class="brief">Two complete study routes. Read a short explanation, predict an outcome, investigate it, then defend your conclusion with evidence. No installation or specialist hardware is needed.</p></div></header>${recoveryPanel()}<section class="panel"><h2>Start here</h2><ol><li>Choose your week below. Work through its three investigations in order.</li><li>In each one, use Learn & predict → Experiment → Explain & review. Instructions and worked debriefs are included.</li><li>Finish the week’s knowledge check and reflection, then export your progress and evidence.</li></ol><p>Used an earlier version? Your saved notes and traces are retained. Complete the new experiment and self-review checks to confirm completion in these study routes.</p><p>Your theme changes appearance only. The same models run in DOS, XP, Windows 7 and Linux themes.</p><p class="small">All measurements are illustrative. This is formative practice, not an OS emulator or a replacement for real installation and command demonstrations.</p></section><div class="week-grid">${[6,7].map(w=>{const st=weekStats(w),d=Course.weeks[w];return `<section class="panel"><h2>Week ${w}: ${d.title}</h2><p>About 120 minutes, including a 5-minute screen break.</p><p>${st.done}/3 investigations complete · ${st.complete?'Week study route complete':'Week study route in progress'}</p><ul>${d.outcomes.map(t=>`<li>${t}</li>`).join('')}</ul><button data-nav="week${w}" class="primary">${st.done?'Continue':'Open'} Week ${w}</button></section>`;}).join('')}</div><section class="panel"><h2>Saving and getting help</h2><p>Work saves in this browser. Export progress creates a JSON backup to import on another PC. Session report produces a readable evidence file or PDF for submission through your normal course arrangements. Private browsing or cleared browser data may function quizView(w){const d=Course.weeks[w],r=weekRec(w),st=weekStats(w);return `<header class="case"><div><p class="eyebrow">Week ${w} / consolidation</p><h1>Check your understanding</h1><p class="brief">These questions check concepts, not your writing. You can retry after using the explanations. Correct answers remain visible after checking so you can study them.</p></div><button data-nav="week${w}">Week ${w} route</button></header><section class="panel"><h2>Apply the ideas</h2>${d.quiz.map((q,i)=>`<fieldset class="quiz-question"><legend>${i+1}. ${q.q}</legend>${q.options.map((x,j)=>`<label class="check-label"><input type="radio" name="quiz-${i}" data-quiz="${i}" value="${j}" ${r.answers[i]===j?'checked':''}> ${x}</label>`).join('')}${r.checked?`<p class="notice"><strong>${r.answers[i]===null?'Not answered':r.answers[i]===q.answer?'Correct':'Revisit this idea'}.</strong> ${q.why} <strong>Supported answer:</strong> ${q.options[q.answer]}</p><button data-nav="${q.revisit}">Revisit ${cases.find(c=>c.id===q.revisit).code}</button>`:''}</fieldset>`).join('')}<button id="checkQuiz" class="primary">Check these answers</button><p role="status" id="quizStatus">${r.checked?`${st.correct}/${d.quiz.length} correct on this attempt. ${st.correct===d.quiz.length?'Continue to your reflection.':'Use the feedback, adjust your answers and check again.'}`:'Choose an answer for every question, then check.'}</p></section><section class="panel"><h2>Bring the week together</h2><label for="weekReflection">${d.exit}</label><textarea id="weekReflection" maxlength="6000" maxlength="6000">${esc(r.reflection)}</textarea><p class="small">Aim for one or two paragraphs, at least 120 characters. Use your own results. This response is saved but not automatically graded.</p><label class="check-label"><input id="weekReviewed" type="checkbox" ${r.reviewed?'checked':''}> I have checked that my reflection uses evidence and acknowledges a limitation.</label><p id="weekStatus" role="status">${weekStatus(w)}</p><div class="controls"><button id="checkWeek">Update week status</button><button data-nav="report" class="primary">Export my evidence</button>${w===6?'<button data-nav="week7">Continue to Week 7</button>':''}</div></section>`;}
function weekStatus(w){const st=weekStats(w),r=weekRec(w);return st.complete?'Week study route complete. Export your progress and evidence before leaving.':`Remaining: ${st.done<3?'complete the three investigations; ':''}${!r.checked||st.correct<5?'answer all five knowledge questions correctly; ':''}${r.reflection.trim().length<120?'write the final reflection (120+ characters); ':''}${!r.reviewed?'review the reflection; ':''}`.replace(/; $/,'.');}
function bindQuiz(w){const r=weekRec(w);document.querySelectorAll('[data-quiz]').forEach(b=>b.onchange=()=>{r.answers[Number(b.dataset.quiz)]=Number(b.value);r.checked=false;document.querySelectorAll('.quiz-question .notice,.quiz-question button').forEach(e=>e.remove());$('quizStatus').textContent='Answers changed. Check these answers again.';$('weekStatus').textContent=weekStatus(w);save();});$('checkQuiz').onclick=()=>{r.checked=true;render();$('quizStatus').scrollIntoView({block:'center'});};$('weekReflection').oninput=e=>{r.reflection=e.target.value;r.reviewed=false;$('weekReviewed').checked=false;$('weekStatus').textContent=weekStatus(w);save();};$('weekReviewed').onchange=e=>{r.reviewed=e.target.checked;$('weekStatus').textContent=weekStatus(w);save();};$('checkWeek').onclick=()=>{$('weekStatus').textContent=weekStatus(w);save();};}
function weekReports(){return [6,7].map(w=>{const r=weekRec(w),st=weekStats(w);return `<section class="panel"><h2>Week ${w} consolidation</h2><p>${st.complete?'Study route complete':'Study route not yet complete'} · ${r.checked?st.correct+'/5 correct on last checked attempt':'Knowledge answers not checked'}</p>${Course.weeks[w].quiz.map((q,i)=>`<p><strong>${q.q}</strong><br>${esc(r.answers[i]===null?'No answer':q.options[r.answers[i]])}</p>`).join('')}<h3>Final reflection</h3><p class="reporttext">${esc(r.reflection||'No reflection recorded.')}</p><p>Self-reviewed: ${r.reviewed?'Yes':'No'}. Written responses are not automatically graded.</p></section>`;}).join('');}
