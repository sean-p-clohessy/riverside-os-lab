</style></head><body><a class="skip" href="#main">Skip to investigation</a><div class="shell"><aside><div class="brand"><span>R/</span> Riverside OS Lab</div><div class="scope">Operating Systems Â· Level 5<br>Unit 50 / Weeks 6 &amp; 7</div><nav id="nav" aria-label="Investigations"></nav><div class="utility"><button id="rename">Set name / alias</button><button id="export">Export progress</button><button id="import">Import progress</button><input id="file" type="file" accept=".json,application/json" hidden><a href="resources.html">Teaching resources</a></div></aside><div><div class="top"><button id="menu" class="menu" aria-expanded="false">Menu</button><span class="identity" id="learner">Learner workspace</span><strong id="points">0 / 600 pts</strong><span id="saveState" class="saved"></span></div><div id="message" role="status"></div><main id="main" class="workspace" tabindex="-1"></main><footer>Teaching simulation Â· No real systems are changed Â· Evidence stays in this browser</footer></div></div><noscript><p>This lab requires JavaScript. Use the teaching resources for printable explanations and worked examples.</p></noscript><script>/* Original, deterministic teaching models. No real processes or files are changed. */
const Models = (() => {
 function race(locked=false){return {locked,value:0,owner:null,pc:[0,0],local:[null,null],log:[]};}
 function raceStep(s,i){
  if(s.pc[i]>=3)return;
  const name=['A','B'][i];
  if(s.locked && s.owner!==null && s.owner!==i){s.log.push(`${name}: blocked on mutex held by ${['A','B'][s.owner]}`);return;}
  if(s.pc[i]===0){if(s.locked)s.owner=i;s.local[i]=s.value;s.log.push(`${name}: READ counter=${s.value}${s.locked?' (mutex acquired)':''}`);}
  if(s.pc[i]===1){s.local[i]++;s.log.push(`${name}: ADD 1 â†’ local=${s.local[i]}`);}
  if(s.pc[i]===2){s.value=s.local[i];s.log.push(`${name}: WRITE counter=${s.value}${s.locked?' (mutex released)':''}`);if(s.locked)s.owner=null;}
  s.pc[i]++;
 }
 function deadlock(ordered=false){return {ordered,owners:[null,null],pc:[0,0],log:[]};}
 function deadStep(s,i){
  if(s.pc[i]>=3)return;
  const n=['A','B'][i], orders=s.ordered?[[0,1],[0,1]]:[[0,1],[1,0]],names=['spool','log'];
  if(s.pc[i]===2){s.owners=s.owners.map(o=>o===i?null:o);s.pc[i]++;s.log.push(`${n}: committed work; released both locks`);return;}
  const r=orders[i][s.pc[i]];
  if(s.owners[r]!==null && s.owners[r]!==i){s.log.push(`${n}: WAIT for ${names[r]}, held by ${['A','B'][s.owners[r]]}`);return;}
  s.owners[r]=i;s.pc[i]++;s.log.push(`${n}: acquired ${names[r]}`);
 }
 function isDead(s){return !s.ordered && s.pc[0]===1 && s.pc[1]===1;}
 function pipeline(cores=1,diskTime=6){
  let jobs=Array.from({length:12},(_,i)=>({id:i+1,cpu:2,disk:diskTime,state:'ready',finish:null})), cpu=Array(cores).fill(null), disk=null,q=[],timeline=[],t=0,busy=0,dbusy=0;
  while(jobs.some(j=>j.finish===null)&&t<500){
   for(let c=0;c<cores;c++)if(cpu[c]===null){const j=jobs.find(j=>j.state==='ready');if(j){j.state='cpu';cpu[c]=j;}}
   if(disk===null&&q.length)disk=q.shift();
   timeline.push({start:t,cpu:cpu.map(j=>j?j.id:'â€“').join(', '),disk:disk?disk.id:'â€“',queue:q.length});
   const finished=[];for(let c=0;c<cores;c++)if(cpu[c]){busy++;cpu[c].cpu--;if(cpu[c].cpu===0){finished.push(cpu[c]);cpu[c]=null;}}
   if(disk){dbusy++;disk.disk--;if(disk.disk===0){disk.finish=t+1;disk.state='done';disk=null;}}
   for(const j of finished){j.state='io';q.push(j);}t++;
  }
  return {cores,diskTime,elapsed:t,throughput:12/t,cpuUtil:busy/(cores*t)*100,diskUtil:dbusy/t*100,jobs,timeline};
 }
 function permissions(policy='original'){
  const x=policy==='group'||policy==='everyone',r=x,guest=policy==='everyone';
  const log=['Application: open /shared/report.txt for reading','Kernel: resolve / (search allowed)'];
  if(!x)log.push('Kernel: /shared lacks group search (x) â†’ EACCES; no device request');
  else {log.push('Kernel: /shared group search (x) allowed','Kernel: report.txt group read (r) allowed','Cache miss assumed â†’ file-system block lookup','Driver: submit device request; caller waits','Device completion interrupt â†’ caller becomes ready','read returns the requested bytes');}
  return {policy,allowed:x&&r,guestAllowed:guest,log};
 }
 function buffer(capacity=2,policy='drop',cut=false){
  let queue=0,pending=0,generated=0,accepted=0,persisted=0,dropped=0,lost=0,rows=[];
  for(let t=1;t<=12;t++){
   const arrived=t<=4?3:0;generated+=arrived;pending+=arrived;
   const take=Math.min(pending,capacity-queue);queue+=take;pending-=take;accepted+=take;
   if(policy==='drop'){dropped+=pending;pending=0;}
   let written=queue>0?1:0;queue-=written;persisted+=written;
   if(cut&&t===4){lost=queue;queue=0;}
   rows.push({t,arrived,accepted:take,written,queue,pending,persisted,dropped,lost});
   if(cut&&t===4)break;
  }
  return {capacity,policy,cut,generated,accepted,persisted,dropped,lost,queue,pending,rows};
 }
 function controller(priority='telemetry',samples=2){
  const memory=48+samples*4,rows=[],jobs=[];
  if(memory>64)return {priority,samples,memory,boot:false,misses:0,rows,jobs};
  for(let t=0;t<20;t++){
   if(t%5===0){jobs.push({name:'Control',release:t,deadline:t+2,left:1,finish:null},{name:'Telemetry',release:t,deadline:t+5,left:3,finish:null});}
   const ready=jobs.filter(j=>j.left>0),first=priority==='control'?'Control':'Telemetry';
   ready.sort((a,b)=>(a.name===first?0:1)-(b.name===first?0:1)||a.release-b.release);
   const j=ready[0];if(j){j.left--;if(j.left===0)j.finish=t+1;}
   rows.push({t,task:j?j.name:'Idle'});
  }
  const misses=jobs.filter(j=>j.name==='Control'&&(j.finish===null||j.finish>j.deadline)).length;
  return {priority,samples,memory,boot:true,misses,rows,jobs};
 }
 return {race,raceStep,deadlock,deadStep,isDead,pipeline,permissions,buffer,controller};
})();
if(typeof module!=='undefined')module.exports=Models;

const cases=[
 {id:'race',week:6,code:'OS-601',title:'The missing update',module:'Threads & shared memory',brief:'Two booking workers each record one arrival. Both finish, but the shared counter sometimes increases only once. Reproduce the fault, then protect the whole update.',target:'Capture an unprotected lost update and a protected run ending at 2.',question:'What makes the protected result reliable in this model?',choices:['The CPU runs both threads simultaneously','The mutex makes the entire readâ€“modifyâ€“write section mutually exclusive','Writing alone is protected; the read can remain outside'],answer:1,hint:'Both workers can read the same old value before either writes. Which operations must stay together?',deeper:'A mutex provides mutual exclusion, not automatic speed. A contending worker may block or spin depending on implementation. Atomic readâ€“modifyâ€“write operations are another option for suitable data. This model treats lock acquisition as atomic and does not model memory-ordering rules.',prompt:'Use the trace to explain the lost update, identify the critical section, and discuss one cost or limitation of the remedy.',source:'threads-locks.pdf'},
 {id:'dead',week:6,code:'OS-602',title:'Both workers are waiting',module:'Locks & deadlock',brief:'A print worker and an audit worker each need the spool lock and the log lock. Their lock order differs. Neither finishes, although the CPU has spare capacity.',target:'Capture circular wait, then complete both workers using one global lock order.',question:'Which necessary deadlock condition does the shared ordering remove?',choices:['Mutual exclusion','No pre-emption','Circular wait'],answer:2,hint:'Compare who owns each lock with who is waiting for it. Adding another CPU does not release a lock.',deeper:'The four necessary conditions are mutual exclusion, hold-and-wait, no pre-emption of resources, and circular wait. CPU pre-emption is not the same as reclaiming an owned lock. Prevention changes the rules; detection and recovery deal with deadlock after it occurs. A consistent total order must be respected by every relevant code path.',prompt:'Name the four conditions, use this trace to locate the cycle, then explain a limitation of ordering or an alternative recovery policy.',source:'threads-bugs.pdf'},
 {id:'bottle',week:6,code:'OS-603',title:'More cores, same delay',module:'Resource efficiency',brief:'Twelve requests arrive together. Each needs 2 ms of CPU service followed by 6 ms on one serial storage device. Investigate whether adding a CPU core addresses the bottleneck.',target:'Run the baseline, test two CPU cores, then test faster storage with one core.',question:'What best explains the results for this workload?',choices:['The serial device limits completion; CPU utilisation alone is not the objective','Low CPU utilisation proves the OS is faulty','Doubling cores must halve elapsed time'],answer:0,hint:'Track completed requests and device utilisation. Keep the workload fixed when comparing configurations.',deeper:'This is a closed batch with unlimited queue capacity, no caching, no overhead and no contention outside the model. Throughput is completed requests divided by total elapsed time. A small CPU change need not improve a device-bound service. Real systems require measured workloads, latency distributions and repeated observations.',prompt:'Quote baseline and changed elapsed time and throughput. Explain why the preferred change works, and what real-system evidence you would need before recommending it.',source:'file-devices.pdf'},
 {id:'files',week:7,code:'OS-701',title:'The report cannot be opened',module:'Files & access control',brief:'A staff reader belongs to the readers group. The report is present, but opening /shared/report.txt fails. Restore the required access without exposing the file to a guest.',target:'Capture the denial; grant group search on the directory and group read on the file; keep guest access denied.',question:'Why is file read permission alone insufficient?',choices:['Every file must be executable to read it','The kernel also checks search permission on the directories in the path','A driver grants file permissions after reading the disk'],answer:1,hint:'Directory search (x) permits path traversal. Directory read (r) concerns listing names; it is not the same operation.',deeper:'This is a simplified POSIX-style access model, not NTFS. Owner is the administrator; the reader uses group permissions and the guest uses other permissions. / already allows search. ACLs, capabilities, links, mounts and mandatory controls are omitted. Metadata includes ownership, permissions, size and times; file contents are a separate concern.',prompt:'Explain the failed path lookup, justify the least-privilege change, and trace the successful cache-miss read from application to device and back.',source:'file-intro.pdf'},
 {id:'buffer',week:7,code:'OS-702',title:'Accepted is not persisted',module:'Devices & I/O queues',brief:'A logger produces 3 records per tick for 4 ticks. Storage writes 1 record per tick. A two-record volatile buffer loses data when full. Investigate a larger buffer, backpressure and a power cut.',target:'Capture overflow, complete a loss-free run, and run a power-cut experiment.',question:'What does a successful buffered write acceptance establish here?',choices:['The record is already on non-volatile storage','A larger buffer permanently increases device throughput','The record entered volatile memory; persistence still requires device completion'],answer:2,hint:'Each tick admits records before draining one. Watch accepted, persisted and lost counts separately.',deeper:'Buffering absorbs bursts; caching retains copies for reuse; spooling queues complete jobs for a device. Interrupts let a device signal completion; polling repeatedly checks its status. DMA can transfer blocks without CPU copying each byte, but still requires coordination. This model has no journalling, flush operation, device cache or power-loss protection.',prompt:'Compare capacity and backpressure as responses to the burst. Use the power-cut counts to explain durability and one limitation of this simplified device model.',source:'file-devices.pdf'},
 {id:'rtos',week:7,code:'OS-703',title:'The controller responds too late',module:'Constrained systems',brief:'An illustrative air-conditioning controller has 64 KiB RAM and one CPU. Control and telemetry jobs arrive every 5 ms. Control needs 1 ms and must finish within 2 ms of release; telemetry needs 3 ms.',target:'Capture missed control deadlines, exceed the memory budget once, then find a configuration that boots and meets all control deadlines.',question:'Which statement is supported by the successful run?',choices:['Any high-priority task always meets its deadline','This stated workload meets deadlines; blocking, interrupts and execution-time variation still need analysis','An RTOS is separate from all firmware'],answer:1,hint:'A response deadline concerns completion after release. Priority changes the order; queue capacity consumes memory.',deeper:'The model uses fixed-priority pre-emptive scheduling with zero switch cost and no blocking. It illustrates concepts relevant to a configured FreeRTOS system; it does not execute FreeRTOS. The firmware image may contain an RTOS, application logic and drivers. iOS could host a remote control app but is not this microcontroller OS. Priority inversion, watchdog design, safe actuator states and energy use need separate engineering.',prompt:'Compare deadlines and the RAM budget. Explain why the successful trace is not a general real-time guarantee and distinguish firmware, RTOS, driver and application responsibilities.',source:'https://www.freertos.org/Documentation/02-Kernel/02-Kernel-features/01-Tasks-and-co-routines/04-Task-scheduling'}
];
const KEY='riverside-os-lab-v1';
let progress={version:1,name:'',records:{}},storageOK=true,current='race',sim={},feedback='';
function validateImport(p){
 if(!p||p.version!==1||typeof p.name!=='string'||!p.records||typeof p.records!=='object')throw Error('This is not a Riverside OS Lab progress file.');
 const clean={version:1,name:p.name.slice(0,80),records:{}};
 for(const c of cases){const r=p.records[c.id];if(!r)continue;if(typeof r!=='object')throw Error('Invalid investigation record.');clean.records[c.id]={note:typeof r.note==='string'?r.note.slice(0,12000):'',choice:Number.isInteger(r.choice)&&r.choice>=0&&r.choice<3?r.choice:null,checks:{},snapshots:[],score:0};const d=clean.records[c.id];for(const k of ['baseline','fixed','extra'])d.checks[k]=r.checks?.[k]===true;
  if(Array.isArray(r.snapshots))d.snapshots=r.snapshots.slice(-12).filter(x=>x&&typeof x.label==='string'&&typeof x.evidence==='string').map(x=>({label:x.label.slice(0,120),evidence:x.evidence.slice(0,18000)}));
  // Imported progress is a local convenience, not authenticated assessment evidence.
  if(r.score===100&&required(c.id).every(k=>d.checks[k])&&d.choice===c.answer&&d.note.trim().length>=80)d.score=100;
 }
 return clean;
}
try{const p=localStorage.getItem(KEY);if(p)progress=validateImport(JSON.parse(p));}catch(e){storageOK=false;}
function rec(id=current){return progress.records[id]||(progress.records[id]={note:'',choice:null,checks:{},snapshots:[],score:0});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));storageOK=true;}catch{storageOK=false;}const el=$('saveState');if(el)el.textContent=storageOK?'Saved in this browser Â· export before changing PCs':'Browser storage unavailable Â· export before closing';}
function required(id){return ['bottle','buffer','rtos'].includes(id)?['baseline','extra','fixed']:['baseline','fixed'];}
function capture(flag,label,evidence){const r=rec();r.checks[flag]=true;r.snapshots.push({label,evidence});r.snapshots=r.snapshots.slice(-12);save();}
function init(id){if(id==='race')sim=Models.race(false);if(id==='dead')sim=Models.deadlock(false);if(id==='bottle')sim={cores:1,disk:6,result:null};if(id==='files')sim={policy:'original',result:null};if(id==='buffer')sim={capacity:2,policy:'drop',cut:false,result:null};if(id==='rtos')sim={priority:'telemetry',samples:2,result:null};}
function nav(id){current=id;feedback='';if(cases.some(c=>c.id===id))init(id);render();document.body.classList.remove('menuopen');$('menu').setAttribute('aria-expanded','false');window.scrollTo(0,0);}
function metrics(arr){return `<div class="metrics">${arr.map(([k,v])=>`<div class="metric"><span>${k}</span><strong>${v}</strong></div>`).join('')}</div>`;}
function trace(lines){return lines.length?`<ol class="trace" aria-label="Execution trace">${lines.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="empty">Run the model to collect an execution trace.</p>';}
function select(id,label,values,value){return `<div><label for="${id}">${label}</label><select id="${id}">${values.map(([v,t])=>`<option value="${v}" ${String(v)===String(value)?'selected':''}>${t}</option>`).join('')}</select></div>`;}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map((h,i)=>`<th${i?' class="num"':''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="num"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function raceView(){return `<h2>Shared counter</h2><p class="small">Two workers Â· one increment each Â· sequentially consistent teaching model</p>${metrics([['Shared value',sim.value],['Expected at completion',2],['Mutex owner',sim.owner===null?'â€“':['A','B'][sim.owner]]])}<div class="controls">${select('lock','Protection',[[0,'No lock'],[1,'Mutex around full update']],sim.locked?1:0)}<button id="resetSim">Reset model</button><button id="run" class="primary">Run competing workers</button></div><div class="steps">${['A','B'].map((n,i)=>`<div class="thread"><strong>Worker ${n}</strong><p>Next: ${['READ shared','ADD locally','WRITE shared','Finished'][sim.pc[i]]}<br>Local value: ${sim.local[i]??'â€“'}</p><button data-thread="${i}" ${sim.pc[i]===3?'disabled':''}>Step worker ${n}</button></div>`).join('')}</div>${trace(sim.log)}`;}
function deadView(){return `<h2>Resource ownership</h2>${table(['Resource','Owner'],[['Spool lock',sim.owners[0]===null?'Free':['A','B'][sim.owners[0]]],['Log lock',sim.owners[1]===null?'Free':['A','B'][sim.owners[1]]]])}<div class="controls">${select('order','Acquisition order',[[0,'A: spool â†’ log; B: log â†’ spool'],[1,'Both: spool â†’ log']],sim.ordered?1:0)}<button id="resetSim">Reset model</button><button id="run" class="primary">Run workers</button></div><div class="steps">${['A','B'].map((n,i)=>`<div class="thread"><strong>Worker ${n}</strong><p>${sim.pc[i]===3?'Completed':`Acquired ${sim.pc[i]} of 2 locks`}</p><button data-thread="${i}" ${sim.pc[i]===3?'disabled':''}>Step worker ${n}</button></div>`).join('')}</div><p class="notice">${Models.isDead(sim)?'Circular wait: A waits for Bâ€™s log lock; B waits for Aâ€™s spool lock.':sim.pc.every(x=>x===3)?'Both workers completed and released their resources.':'Inspect ownership, then advance either worker.'}</p>${trace(sim.log)}`;}
function bottleView(){const r=sim.result;return `<h2>Batch workload</h2><p>12 requests at t = 0. Each uses CPU for 2 ms, then the serial device. Device service starts on the next tick after CPU completion.</p><div class="controls">${select('cores','CPU cores',[[1,'1 core'],[2,'2 cores']],sim.cores)}${select('disk','Device service per request',[[6,'6 ms'],[2,'2 ms']],sim.disk)}<button id="run" class="primary">Run batch</button></div>${r?`${metrics([['Elapsed',r.elapsed+' ms'],['Throughput',r.throughput.toFixed(3)+'/ms'],['CPU utilisation',r.cpuUtil.toFixed(1)+'%'],['Device utilisation',r.diskUtil.toFixed(1)+'%']])}${table(['Request','Completion (ms)'],r.jobs.map(j=>['Request '+j.id,j.finish]))}<details><summary>Inspect per-millisecond execution</summary>${table(['Time (ms)','CPU job(s)','Device job','Queued for device'],r.timeline.map(x=>[x.start,x.cpu,x.disk,x.queue]))}</details>`:'<p class="empty">Run the baseline before changing the resources.</p>'}`;}
function filesView(){const r=sim.result;return `<h2>File access inspector</h2>${table(['Object','Owner','Group','Original permissions'],[['/shared','admin','readers','rwx------'],['report.txt','admin','readers','rw-------']])}<p class="small">Reader is not the owner; reader belongs to readers. Guest belongs to neither. This is an intentionally restricted POSIX-style model.</p><div class="controls">${select('policy','Access change',[['original','Keep original permissions'],['group','Group: directory x + file r'],['everyone','Everyone: directory x + file r']],sim.policy)}<button id="run" class="primary">Test reader and guest</button></div>${r?metrics([['Reader',r.allowed?'Allowed':'Denied'],['Guest',r.guestAllowed?'Allowed':'Denied']]):''}<div class="flow">${['Application','Kernel / access','File system','Driver','Device'].map(n=>`<span>${n}</span>`).join('')}</div>${trace(r?.log||[])}`;}
function bufferView(){const r=sim.result;return `<h2>Volatile write buffer</h2><p class="small">Ticks 1â€“4: 3 new records/tick. Admission precedes device drain: 1 record/tick. Power cut stops the model after tick 4.</p><div class="controls">${select('capacity','Buffer capacity',[[2,'2 records'],[9,'9 records']],sim.capacity)}${select('backpressure','When buffer is full',[['drop','Drop unaccepted records'],['wait','Backpressure: hold at producer']],sim.policy)}${select('cut','Power supply',[[0,'Continuous power'],[1,'Cut after tick 4 drain']],sim.cut?1:0)}<button id="run" class="primary">Run logger</button></div>${r?`${metrics([['Generated',r.generated],['Accepted',r.accepted],['Persisted',r.persisted],['Dropped / lost',`${r.dropped} / ${r.lost}`]])}${table(['Tick','New','Admitted','Buffer','Producer waiting','Persisted'],r.rows.map(x=>[x.t,x.arrived,x.accepted,x.queue,x.pending,x.persisted]))}<p class="notice">${r.cut?`${r.lost} accepted records were lost from volatile memory; ${r.pending} records remained at the producer. No automatic restart is modelled.`:`${r.persisted} records persisted; ${r.dropped} dropped; ${r.queue} buffered; ${r.pending} waiting at producer.`}</p>`:'<p class="empty">Run the small-buffer baseline to observe overflow.</p>'}`;}
function rtosView(){const r=sim.result;return `<h2>Air-conditioning controller</h2><p class="small">One CPU Â· 20 ms window Â· fixed-priority pre-emption Â· control 1 ms / period 5 ms / relative deadline 2 ms Â· telemetry 3 ms / period 5 ms</p><div class="controls">${select('priority','Higher-priority task',[['telemetry','Telemetry'],['control','Control']],sim.priority)}${select('samples','Queue allocation',[[2,'2 Ã— 4 KiB blocks'],[4,'4 Ã— 4 KiB blocks'],[8,'8 Ã— 4 KiB blocks']],sim.samples)}<button id="run" class="primary">Boot and run 20 ms</button></div><p>RAM = 32 KiB platform + 2 Ã— 8 KiB task stacks + queue allocation. Available: 64 KiB. Blocks are illustrative allocations, not a claim that a temperature reading occupies 4 KiB.</p>${r?`${metrics([['RAM required',r.memory+' KiB'],['Boot',r.boot?'Ready':'Rejected'],['Control misses',r.boot?r.misses:'â€“']])}<div class="bar" aria-label="RAM ${r.memory} of 64 KiB"><span style="width:${Math.min(100,r.memory/64*100)}%"></span></div>${r.boot?`<div class="tablewrap"><div class="timeline">${r.rows.map(x=>`<div class="tick ${x.task==='Control'?'control':''}" title="${x.t}â€“${x.t+1} ms: ${x.task}">${x.task[0]}<span>${x.t}</span></div>`).join('')}</div></div><p class="legend">C = Control Â· T = Telemetry Â· I = Idle. Each cell spans 1 ms; final cell ends at 20 ms.</p>${table(['Control release (ms)','Deadline (ms)','Finished (ms)','Result'],r.jobs.filter(j=>j.name==='Control').map(j=>[j.release,j.deadline,j.finish,j.finish<=j.deadline?'Met':'Missed']))}`:'<p class="notice">Requested allocation exceeds available RAM. No task executes; a deadline count would be meaningless.</p>'}`:'<p class="empty">Run the original telemetry-first configuration.</p>'}`;}
function checkLabels(id){return {baseline:'Fault reproduced and captured',extra:id==='bottle'?'Two-core comparison captured':id==='buffer'?'Power-cut experiment captured':'Memory-budget failure captured',fixed:'Working remedy captured'};}
function investigation(c){const r=rec(),labels=checkLabels(c.id);return `<header class="case"><div><div class="eyebrow">Week ${c.week} / ${c.code} / ${c.module}</div><h1>${c.title}</h1><p class="brief">${c.brief}</p></div><button id="startOver">Restart investigation</button></header><div class="grid"><section class="panel">${({race:raceView,dead:deadView,bottle:bottleView,files:filesView,buffer:bufferView,rtos:rtosView}[c.id])()}</section><section class="panel"><h2>Investigation brief</h2><p>${c.target}</p><ul class="checks">${required(c.id).map(k=>`<li class="${r.checks[k]?'yes':''}">${r.checks[k]?'âœ“':'â—‹'} ${labels[k]}</li>`).join('')}</ul><details><summary>Show a diagnostic hint</summary><p>${c.hint}</p></details><details><summary>Mechanism and model limits</summary><p>${c.deeper}</p><a href="${c.source.startsWith('http')?c.source:'https://pages.cs.wisc.edu/~remzi/OSTEP/'+c.source}" target="_blank" rel="noopener">Read the source</a></details><h3>Explain your evidence</h3><p class="small">${c.prompt}</p><label for="reason">Your analysis (at least 80 characters)</label><textarea id="reason" maxlength="12000">${esc(r.note)}</textarea><label for="diagnosis">${c.question}</label><select id="diagnosis" style="width:100%"><option value="">Select your conclusion</option>${c.choices.map((x,i)=>`<option value="${i}" ${r.choice===i?'selected':''}>${x}</option>`).join('')}</select><p class="small">The written analysis is saved for discussion, not automatically graded. Practice points are not a BTEC grade.</p><button id="submit" class="primary">Check investigation</button><div class="feedback" role="status">${esc(feedback|| (r.score?'100 practice points recorded. Analysis remains for tutor review.':''))}</div></section></div><section class="panel"><h2>Evidence notebook</h2><p class="small">Snapshots are retained when you reproduce a fault or test a remedy. Resetting the model keeps these snapshots.</p>${r.snapshots.length?r.snapshots.map((s,i)=>`<details><summary>${i+1}. ${esc(s.label)}</summary><pre class="reporttext">${esc(s.evidence)}</pre></details>`).join(''):'<p class="empty">No evidence captured yet.</p>'}</section>`;}
function report(){return `<header class="case"><div><div class="eyebrow">Local evidence / Unit 50</div><h1>Session report</h1><p class="brief">${esc(progress.name||'Unnamed learner')} Â· ${total()} / 600 practice points. Scores are self-contained practice records, not authenticated assessment results.</p></div><button id="printReport">Print / save PDF</button></header><div class="controls"><button id="exportReport" class="primary">Download evidence report</button><button id="exportJSON">Export progress JSON</button></div>${cases.map(c=>{const r=rec(c.id);return `<section class="panel"><h2>${c.code} Â· ${c.title}</h2><p>${r.score||0} / 100 points Â· ${required(c.id).filter(k=>r.checks[k]).length} / ${required(c.id).length} practical checks</p><p><strong>Analysis</strong></p><div class="reporttext">${esc(r.note||'No analysis recorded.')}</div><p><strong>Conclusion:</strong> ${esc(r.choice===null?'Not selected':c.choices[r.choice])}</p><details><summary>Captured evidence (${r.snapshots.length})</summary>${r.snapshots.map(s=>`<h3>${esc(s.label)}</h3><pre class="reporttext">${esc(s.evidence)}</pre>`).join('')}</details></section>`;}).join('')}`;}
function library(){return `<h1>Lab handbook</h1><p class="brief">Riverside OS Lab is an original teaching simulation for Unit 50, Level 5. It models selected mechanisms, not a complete operating system. All workloads, timings and device capacities are illustrative.</p><section class="panel"><h2>How to investigate</h2><ol><li>Predict what will happen before running the original configuration.</li><li>Reproduce the fault and inspect the trace.</li><li>Change one relevant variable and compare the outcome.</li><li>Explain the mechanism, trade-off and limits using the captured evidence.</li></ol><p>Each investigation awards 100 practice points once its practical checks, conclusion and written-response requirement are complete. Retrying never duplicates points. Text length only confirms that a response exists; it does not establish its quality.</p><p>Nothing you click changes a real OS, file permission or device. Later LO3 work must demonstrate real commands in the approved environments.</p></section><section class="panel"><h2>Sources and further reading</h2><ul class="resources"><li>Arpaci-Dusseau, R. H. and Arpaci-Dusseau, A. C. (2023). <em>Operating Systems: Three Easy Pieces</em>, version 1.10. <a href="https://pages.cs.wisc.edu/~remzi/OSTEP/" target="_blank" rel="noopener">Author-hosted textbook</a>. Chapters 26, 28, 30â€“32, 36 and 39 support the lecture principles.</li><li><a href="https://man7.org/linux/man-pages/man7/path_resolution.7.html" target="_blank" rel="noopener">Linux manual: path_resolution(7)</a> â€” search permissions and access failure.</li><li><a href="https://www.freertos.org/Documentation/02-Kernel/02-Kernel-features/01-Tasks-and-co-routines/04-Task-scheduling" target="_blank" rel="noopener">FreeRTOS task scheduling</a> â€” implementation context; our controller is not an emulator.</li></ul><p class="small">Sources consulted 5 November 2026. The simulations and their numerical datasets are original teaching examples.</p></section><section class="panel"><h2>Progress and access</h2><p>Your name or alias, notes and traces stay in this browser. There is no login, teacher dashboard or central leaderboard. Other people using this browser profile may see this work. Export progress before changing PCs. Import merges by replacing the current local record after confirmation.</p><p>Use buttons with a mouse or keyboard. All traces have text or table equivalents. On small screens, use Menu to switch investigations. The single-file download works offline; reference links require internet access.</p><p><a href="Riverside_OS_Lab_Offline.html" download>Download the offline lab</a> Â· <a href="resources.html">Week 6 and 7 teaching resources</a></p></section>`;}
function total(){return cases.reduce((n,c)=>n+(progress.records[c.id]?.score===100?100:0),0);}
function render(){
 $('nav').innerHTML=[6,7].map(w=>`<div class="navgroup">Week ${w}</div>${cases.filter(c=>c.week===w).map(c=>`<button data-nav="${c.id}" aria-current="${current===c.id?'page':'false'}"><span class="navid">${c.code}${progress.records[c.id]?.score?' Â· complete':''}</span>${c.title}</button>`).join('')}`).join('')+`<div class="navgroup">Evidence & reference</div><button data-nav="report" aria-current="${current==='report'?'page':'false'}">Session report</button><button data-nav="library" aria-current="${current==='library'?'page':'false'}">Lab handbook</button>`;
 $('points').textContent=total()+' / 600 pts';$('learner').textContent=progress.name||'Learner workspace';
 $('main').innerHTML=current==='report'?report():current==='library'?library():investigation(cases.find(c=>c.id===current));
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));
 if(current==='report'){ $('printReport').onclick=()=>window.print();$('exportReport').onclick=downloadReport;$('exportJSON').onclick=exportJSON; }
 else if(current!=='library')bind();save();
}
function bind(){
 $('reason').oninput=e=>{rec().note=e.target.value;save();};$('diagnosis').onchange=e=>{rec().choice=e.target.value===''?null:Number(e.target.value);save();};
 $('submit').onclick=()=>{const c=cases.find(c=>c.id===current),r=rec();if(!required(current).every(k=>r.checks[k]))feedback='Complete the practical checks first. Keep the original fault and remedy in your evidence.';else if(r.choice!==c.answer)feedback='Revisit your conclusion: '+c.hint;else if(r.note.trim().length<80)feedback='Add an explanation of at least 80 characters, including evidence and a limitation.';else{r.score=100;feedback='Practical checks and conclusion complete: 100 points. Your analysis is saved for tutor review.';}render();};
 $('startOver').onclick=()=>{if(confirm('Restart this investigation? Its notes, snapshots and points will be removed. Other investigations remain.')){delete progress.records[current];init(current);feedback='Investigation restarted.';render();}};
 if($('resetSim'))$('resetSim').onclick=()=>{if(current==='race')sim=Models.race(sim.locked);else sim=Models.deadlock(sim.ordered);render();};
 if(current==='race'){$('lock').onchange=e=>{sim=Models.race(e.target.value==='1');render();};document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{Models.raceStep(sim,Number(b.dataset.thread));captureRace();render();});}
 if(current==='dead'){$('order').onchange=e=>{sim=Models.deadlock(e.target.value==='1');render();};document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{Models.deadStep(sim,Number(b.dataset.thread));captureDead();render();});}
 $('run').onclick=run;
 if(current==='bottle'){ $('cores').onchange=e=>{sim.cores=Number(e.target.value);sim.result=null;render();};$('disk').onchange=e=>{sim.disk=Number(e.target.value);sim.result=null;render();}; }
 if(current==='files')$('policy').onchange=e=>{sim.policy=e.target.value;sim.result=null;render();};
 if(current==='buffer'){for(const [id,key] of [['capacity','capacity'],['backpressure','policy'],['cut','cut']])$(id).onchange=e=>{sim[key]=key==='capacity'?Number(e.target.value):key==='cut'?e.target.value==='1':e.target.value;sim.result=null;render();};}
 if(current==='rtos'){ $('priority').onchange=e=>{sim.priority=e.target.value;sim.result=null;render();};$('samples').onchange=e=>{sim.samples=Number(e.target.value);sim.result=null;render();}; }
}
function captureRace(){if(sim.pc.every(x=>x===3)){if(!sim.locked&&sim.value===1)capture('baseline','Lost update: unprotected counter = 1',sim.log.join('\n'));if(sim.locked&&sim.value===2)capture('fixed','Protected counter = 2',sim.log.join('\n'));}}
function captureDead(){if(Models.isDead(sim))capture('baseline','Circular wait reproduced',sim.log.join('\n'));if(sim.ordered&&sim.pc.every(x=>x===3))capture('fixed','Global order: both completed',sim.log.join('\n'));}
function run(){
 feedback='';
 if(current==='race'){sim=Models.race(sim.locked);for(let n=0;n<8;n++){Models.raceStep(sim,0);Models.raceStep(sim,1);}captureRace();}
 if(current==='dead'){sim=Models.deadlock(sim.ordered);for(let n=0;n<6;n++){Models.deadStep(sim,0);Models.deadStep(sim,1);if(Models.isDead(sim))break;}captureDead();}
 if(current==='bottle'){const r=sim.result=Models.pipeline(sim.cores,sim.disk),ev=`${r.cores} core(s); CPU service 2 ms; device service ${r.diskTime} ms\n12 jobs completed in ${r.elapsed} ms; throughput ${r.throughput.toFixed(3)} requests/ms\nCPU utilisation ${r.cpuUtil.toFixed(1)}%; device utilisation ${r.diskUtil.toFixed(1)}%\nCompletion times: ${r.jobs.map(j=>j.finish).join(', ')} ms`;
  const flag=sim.cores===1&&sim.disk===6?'baseline':sim.cores===2&&sim.disk===6?'extra':sim.cores===1&&sim.disk===2?'fixed':null;
  if(flag)capture(flag,`${sim.cores} core(s), ${sim.disk} ms device`,ev);else {rec().snapshots.push({label:'Two changes: 2 cores and faster device',evidence:ev});save();} }
 if(current==='files'){const r=sim.result=Models.permissions(sim.policy);if(!r.allowed)capture('baseline','Original access denied',r.log.join('\n'));else if(!r.guestAllowed)capture('fixed','Reader allowed; guest denied',r.log.join('\n')+'\nGuest: denied');else feedback='The reader can open the file, but so can a guest. The access requirement is not met.';}
 if(current==='buffer'){const r=sim.result=Models.buffer(sim.capacity,sim.policy,sim.cut),ev=JSON.stringify(r,null,2);if(r.cut)capture('extra','Power cut after tick 4',ev);else if(r.dropped>0)capture('baseline','Buffer overflow',ev);else if(r.persisted===12)capture('fixed',`All records persisted (${r.capacity} slots; ${r.policy})`,ev);}
 if(current==='rtos'){const r=sim.result=Models.controller(sim.priority,sim.samples),ev=JSON.stringify(r,null,2);if(!r.boot)capture('extra','RAM allocation rejected',ev);else if(r.misses>0)capture('baseline','Control deadlines missed',ev);else capture('fixed','All four control deadlines met',ev);}
 render();
}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function exportJSON(){download('Riverside_OS_Lab_Progress.json',JSON.stringify(progress,null,2),'application/json');}
function downloadReport(){let lines=[`Riverside OS Lab â€” evidence report`,`Learner / alias: ${progress.name||'Not entered'}`,`Exported: ${new Date().toISOString()}`,`Practice points: ${total()}/600. Locally editable practice record; not authenticated assessment evidence.`,``];for(const c of cases){const r=rec(c.id);lines.push(`${c.code} ${c.title}`,`Points: ${r.score}/100`,`Analysis: ${r.note||'Not recorded'}`,`Conclusion: ${r.choice===null?'Not selected':c.choices[r.choice]}`, ...r.snapshots.flatMap(s=>[s.label,s.evidence]),'');}download('Riverside_OS_Lab_Evidence.txt',lines.join('\n\n'),'text/plain');}
document.getElementById('menu').onclick=()=>{document.body.classList.toggle('menuopen');$('menu').setAttribute('aria-expanded',document.body.classList.contains('menuopen'));};
$('export').onclick=exportJSON;$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('File is too large. Use an exported progress JSON file.');const p=validateImport(JSON.parse(await f.text()));if(confirm('Replace this browserâ€™s current OS Lab progress with the imported record? Export your current work first if needed.')){progress=p;init(current);render();$('message').textContent='Progress imported.';}}catch(err){$('message').textContent='Import failed: '+err.message;}e.target.value='';};
$('rename').onclick=()=>{const name=prompt('Name or alias for your evidence (stored only in this browser):',progress.name);if(name!==null){progress.name=name.slice(0,80);render();}};
init('race');render();
let printDetails=[];
window.addEventListener('beforeprint',()=>{printDetails=[...document.querySelectorAll('details:not([open])')];printDetails.forEach(d=>d.open=true);});
window.addEventListener('afterprint',()=>{printDetails.forEach(d=>d.open=false);printDetails=[];});
</script></body></html>
